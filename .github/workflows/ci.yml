# Continuous integration.
#
# ────────────────────────────────────────────────────────────────────────────────────────────────
# THE `check` AND `image` JOBS BELOW ARE TEMPORARY. The org's reusable `web-ci.yml` is the target
# and the `hygiene` job already calls the org repository; the two local jobs exist for one reason
# and disappear with it:
#
#   @cloudsforge/ui is unpublished, and this repository consumes it as `link:../ui/packages/ui`.
#   The reusable workflow does a single checkout and then `pnpm install --frozen-lockfile`, which
#   cannot resolve a sibling directory that is not there. The day the design system is published
#   and the specifier in package.json becomes `^1.0.0`, everything from `check:` to the end of
#   `image:` is deleted and replaced by:
#
#     jobs:
#       ci:
#         uses: cloudsforge-online/micro-org/.github/workflows/web-ci.yml@main
#         with:
#           app: hub-web
#         permissions:
#           contents: read
#           packages: read
#
#   — the calling convention in `org/templates/web/_github/workflows/ci.yml`. The measured target
#   in docs/ecosystem/03 §5 is zero repositories with a bespoke CI file, so treat every line from
#   `check:` down as a liability with a deletion date rather than as something to extend.
#
# ONE INPUT OF THE REUSABLE WORKFLOW WILL STILL NOT SUIT THIS REPOSITORY: its `image` job probes
# `/some/deep/route` and requires a 200. Forge Hub's nginx.conf enumerates the app's real routes
# and answers 404 for everything else ON PURPOSE — an unknown address served as a success is
# indexed by crawlers and called healthy by monitors. So `build-image: false` will be passed and
# the image is checked here, where the probe can assert the honest answer instead.
#
# ── BOTH REASONS ABOVE ARE NOW OUT OF DATE, AND THE CONCLUSION STILL HOLDS ───────────────────────
#
# Re-checked against micro-org rather than believed:
#
#   * the single checkout is fixed. web-ci.yml now checks the app out into `app/`, micro-ui
#     into `ui/` beside it, and installs THE SIBLING FIRST — the exact shape of the `check:` job
#     below. micro-ui is also public now, so the `estate_token` fallback to `github.token` works.
#   * the deep-route probe is fixed, and inverted. web-ci.yml REQUIRES an unknown path to
#     answer 404 and names `try_files $uri /index.html` as the thing not to do; the 200 is now only
#     asked of the optional `deep-link-path` input, a route the app really has.
#
# So the two things that made a bespoke `check:` and `image:` unavoidable are gone. This file is
# still not deleted, because what remains is not a workaround:
#
#   * `rules:` was never claimed to be temporary — read the first line of this header again, it
#     names `check` and `image` only — and web-ci.yml has no input that could carry it. Its
#     `runtime-hosts` job checks VITE_*, build arguments, third-party analytics and the README.
#     It does not and cannot check that `bootstrapSession` runs before React mounts (line 182),
#     that no CloudsForge hostname is written down literally (line 151), or that nginx.conf keeps
#     its `error_page 404` (line 162). Those are this repository's rules, not the estate's.
#   * the `image:` job here asserts strictly more than the shared one: that the 404 still SERVES
#     THE APP SHELL (lines 240-241), which web-ci.yml only checks the status code of.
#
# Migrating would therefore delete assertions to save a checkout that is already written. What was
# genuinely missing was a PRODUCER — nothing here ever pushed the image it built — and that is what
# the `publish` job at the end of this file adds.
# ────────────────────────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    # `release/**` builds too. A release branch carries the estate-wide version bump, and it
    # has to publish its images before testnet can be deployed from it — which is what proves
    # the release before anything is merged. Mainnet is unaffected: it pins a version tag.
    branches: [main, 'design-system/**', 'release/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: hub-web }

      # Temporary, for the same reason as the Dockerfile's second build context: the design system
      # is unpublished and resolves through `link:../ui/packages/ui`.
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-ui
          path: ui
          # micro-ui is private; without a contents:read token this checkout 404s and the job
          # dies before install. Same wiring as the service repos' runtime checkout.
          token: ${{ secrets.ESTATE_READ_TOKEN }}

      # ──────────────────────────────────────────────────────────────────────────────────────
      # NOT TEMPORARY, AND NOT FOR INSTALL. These three are never installed and never bundled —
      # `test/wallet-assets.test.ts` and `test/pool-contract.test.ts` READ them, and would
      # otherwise be checks that turn themselves off in the one environment that matters.
      #
      # `src/lib/money.ts` carries the list of assets `micro-wallet` will move, because a
      # browser bundle cannot import a service's source. Every other test in this repository
      # answers its own requests from a stand-in, so a Send menu offering an asset the service
      # refuses is green here and broken in production — which is what happened with SHARD.
      # The test parses `CHAIN_FOR_ASSET` out of wallet and asserts set equality, and it FAILS
      # rather than skips when the checkout is missing. `micro-site` does the same thing with
      # micro-contracts for the numbers it publishes.
      #
      # No token: the estate's active repositories are public. Add
      # `token: ${{ secrets.ESTATE_READ_TOKEN }}` if either is ever made private again.
      # ──────────────────────────────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-wallet
          path: wallet

      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-contracts
          path: contracts

      # micro-pool, for the same reason and a sharper one. `test/pool-contract.test.ts` does not
      # describe the Stratum wire format — it IMPORTS micro-pool's `Session`, `JobRegistry`, `pow`
      # and `validate` and mines a share the real server then accepts. Every field of
      # `mining.submit` is positional, every one of them is eight hex characters, and a client that
      # swapped two of them would assemble a header, hash it, and be answered "stale" for ever.
      # That is the failure this checkout exists to make impossible, and it is why the test throws
      # rather than skips when `pool/src/session.ts` is absent.
      #
      # Nothing is installed from it: the test imports it by dynamic path, and asserts as it goes
      # that the reachable graph imports nothing outside `./` and `node:` — so no service
      # dependency can reach this bundle, and none needs to be installed for the test to run.
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-pool
          path: pool

      # Pinned, because the checkout lives at hub-web/ and the action looks for the
      # packageManager field in the workspace root, where there is no package.json.
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: hub-web/pnpm-lock.yaml }

      # `link:` resolves to the sibling's own node_modules, so the design system must be
      # installed before this repository is — without this, `tsc` cannot resolve ../ui's own
      # imports (react, react/jsx-runtime) when it typechecks the linked sources.
      - name: Install the sibling design system
        run: pnpm --dir ui install --frozen-lockfile

      - name: Install
        working-directory: hub-web
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: hub-web
        run: pnpm typecheck

      - name: Test
        working-directory: hub-web
        run: pnpm test

      - name: Build
        working-directory: hub-web
        run: pnpm build

      # A frontend that builds to nothing is a blank page, not a build failure. The previous estate
      # served SPAs from the API process and shipped an image with no dist in it.
      - name: The bundle exists
        working-directory: hub-web
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html is missing after a successful build"; exit 1; }
          echo "ok: $(find dist -type f | wc -l | tr -d ' ') files in dist"

  rules:
    name: Estate rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No build-time configuration
        # The same rule as test/no-build-time-config.test.ts, checked again here so it fails even
        # if somebody deletes the test along with the line it forbids. A `VITE_` variable is read
        # at build time and frozen into the artefact, and an artefact with an environment frozen
        # into it has to be rebuilt to be promoted — which means the thing that reaches production
        # is not the thing that passed CI.
        run: |
          set -uo pipefail
          if grep -rn --include='*.ts' --include='*.tsx' --include='*.html' \
               -e 'import\.meta\.env' -e 'VITE_' src index.html; then
            echo "::error::this bundle must read no build-time environment; hosts come from cloudsforgeHosts() at runtime"
            exit 1
          fi
          echo "ok: no build-time environment"

      - name: No hard-coded CloudsForge hostname
        # A literal hostname is a second, unversioned copy of the surface registry, and the copy is
        # the one that will be wrong.
        run: |
          set -uo pipefail
          if grep -rn --include='*.ts' --include='*.tsx' 'cloudsforge\.online' src; then
            echo "::error::resolve hosts through cloudsforgeHosts() rather than naming them"
            exit 1
          fi
          echo "ok: no literal hostnames in src"

      - name: The SPA fallback keeps its 404
        # Comments are stripped first. nginx.conf's own header QUOTES the directive it forbids, in
        # order to explain why the routes are enumerated by hand, so a grep over the raw file
        # matches the warning and fails a correct config. (The web template's copy of this step
        # does exactly that, and fails on its own pristine nginx.conf.)
        run: |
          set -uo pipefail
          directives=$(grep -v '^[[:space:]]*#' nginx.conf)
          if printf '%s\n' "$directives" | grep -nE 'try_files[[:space:]]+\$uri[[:space:]]+(\$uri/[[:space:]]+)?/index\.html'; then
            echo "::error::unknown paths must 404; serve the shell through error_page 404 /index.html"
            exit 1
          fi
          # `grep -q PATTERN <<<"$var"` rather than `printf '%s\n' "$var" | grep -q PATTERN`.
          # grep -q exits on its first match by design; the producer then writes into a closed pipe,
          # and `pipefail` promoted that SIGPIPE (exit 141) to a failed step — a gate that failed for
          # no reason and passed on re-run, which teaches re-running instead of reading. The here-string
          # is byte-identical input with the same exit status and no pipe, so the rule is unchanged.
          grep -q 'error_page 404 /index.html' <<<"$directives"
          echo "ok: unknown paths answer 404"

      - name: The auth callback is redeemed before the app renders
        # The hand-off code has to leave the address bar before the exchange goes over the wire,
        # and that only happens if bootstrapSession() runs before React mounts.
        run: grep -q 'bootstrapSession' src/main.tsx

      - name: The route table, the navigation and nginx agree
        # Already asserted by test/routes.test.ts; repeated here so deleting the test does not
        # silently delete the rule. A route in the router but not in nginx works under `pnpm dev`
        # and 404s on the first hard refresh in production.
        run: test -f test/routes.test.ts && grep -q 'nginx.conf' test/routes.test.ts

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: hub-web }
      - uses: actions/checkout@v4
        with:
          repository: cloudsforge-online/micro-ui
          path: ui
          # micro-ui is private; without a contents:read token this checkout 404s and the job
          # dies before install. Same wiring as the service repos' runtime checkout.
          token: ${{ secrets.ESTATE_READ_TOKEN }}

      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: hub-web
          build-contexts: uipkg=ui
          build-args: RELEASE=${{ github.sha }}
          push: false
          load: true
          tags: hub-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image serves the SPA, and 404s an address it does not own
        run: |
          set -euo pipefail
          docker run -d --name ci-hub-web -p 127.0.0.1:8080:8080 hub-web:ci
          for attempt in $(seq 1 20); do
            code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "${code:-}" = "200" ] || { echo "::error::the image returned ${code:-no answer} for /"; docker logs --tail 60 ci-hub-web; exit 1; }

          # A route this app OWNS must survive a hard refresh.
          deep=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/wallet/deposits/abc || true)
          [ "$deep" = "200" ] || { echo "::error::/wallet/deposits/abc returned $deep — an owned route must be served the shell"; exit 1; }

          # A route it does NOT own must answer 404 while still serving the shell, so the reader
          # gets a real page and the status line tells the truth. This is the assertion the org's
          # reusable image job cannot make, because it requires a 200 for any deep link.
          unknown=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/nope/not/a/route || true)
          [ "$unknown" = "404" ] || { echo "::error::an unknown address returned $unknown; it must be 404"; exit 1; }
          #
          # NO PIPE INTO `grep -q` HERE, AND THAT IS THE WHOLE POINT OF THESE FOUR LINES.
          # `curl … | grep -q PATTERN` under `set -o pipefail` is a coin flip, not a check: grep
          # exits the instant it matches, which closes the pipe while curl is still writing the
          # rest of the body, and curl then dies of EPIPE with status 23. pipefail reports the
          # STEP as failed — with the message below, which says the shell was not served about a
          # shell that was served perfectly. It is unfalsifiable from the log.
          # It became reachable on 2026-08-09, when 163a319 put the crawler's copy INSIDE
          # `<div id="root">`: the match moved from the last bytes of index.html to byte 7,743 of
          # 12,163, leaving 4,420 bytes for curl to lose the race on. Measured 2026-08-10 —
          # micro-org#347.
          # Capturing first and matching in the shell has no pipe to break, and `case` is exact
          # rather than a regex, so the pattern means what it looks like.
          shell_404=$(curl -s -m 5 http://127.0.0.1:8080/nope/not/a/route || true)
          case "$shell_404" in
            *'<div id="root">'*) ;;
            *) echo "::error::the 404 did not serve the app shell"; exit 1 ;;
          esac
          echo "ok: owned routes are served, unknown addresses 404 with the shell"
      # ── THE DEPLOYMENT DOCUMENT, AND THE ENVIRONMENT IS WHAT DECIDES IT ─────────────────────
      #
      # micro-org#406. `/mine` learns whether this estate has a mining pool from
      # `GET /deployment.json`, which nginx renders at CONTAINER START from `POOL_API_PRESENCE`.
      # Three things are checked here that no unit test can see, and the first one is why this step
      # exists at all: MEASURED 2026-08-11 on micro-pool-web's identical mechanism, an image with
      # the variable UNSET did not serve a wrong document — it EXITED 1 with
      # `nginx: [emerg] unknown "pool_api_presence" variable`, because envsubst substitutes only
      # variables that are set and has no `${VAR:-default}`. The `ENV` line in the Dockerfile is the
      # fix; this is what would have caught its absence.
      - name: The deployment document is served, and the environment is what decides it
        run: |
          set -euo pipefail

          # 1. AN IMAGE NOBODY HAS CONFIGURED STARTS, AND SAYS THERE IS A POOL.
          docker run -d --name ci-hub-web-default -p 127.0.0.1:8081:8080 hub-web:ci
          for attempt in $(seq 1 20); do
            code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/deployment.json || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "${code:-}" = "200" ] || { echo "::error::an unconfigured image answered ${code:-nothing} for /deployment.json"; docker logs --tail 60 ci-hub-web-default; exit 1; }
          default=$(curl -s -m 5 http://127.0.0.1:8081/deployment.json)
          case "$default" in
            *'"poolApi":"absent"'*) echo "::error::an unconfigured image reports NO POOL: $default"; exit 1 ;;
            *'"poolApi"'*) ;;
            *) echo "::error::the document has no poolApi field: $default"; exit 1 ;;
          esac
          type=$(curl -s -m 5 -o /dev/null -w '%{content_type}' http://127.0.0.1:8081/deployment.json)
          case "$type" in
            application/json*) ;;
            *) echo "::error::/deployment.json was served as $type"; exit 1 ;;
          esac

          # 2. THE FLAG IS WHAT CHANGES IT, and only the container's environment is different.
          docker run -d --name ci-hub-web-absent -p 127.0.0.1:8082:8080 -e POOL_API_PRESENCE=absent hub-web:ci
          for attempt in $(seq 1 20); do
            code=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8082/deployment.json || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "${code:-}" = "200" ] || { echo "::error::the configured image answered ${code:-nothing}"; docker logs --tail 60 ci-hub-web-absent; exit 1; }
          absent=$(curl -s -m 5 http://127.0.0.1:8082/deployment.json)
          case "$absent" in
            *'"poolApi":"absent"'*) ;;
            *) echo "::error::POOL_API_PRESENCE=absent did not reach the document: $absent"; exit 1 ;;
          esac

          # 3. AND IT CHANGES NOTHING ELSE. The flag is a sentence on one panel, not a deploy mode.
          shell=$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:8082/mine || true)
          [ "$shell" = "200" ] || { echo "::error::/mine answered $shell on a deployment with no pool"; exit 1; }

          echo "ok: default=$default absent=$absent"
      - name: Down
        if: always()
        run: docker rm -f ci-hub-web ci-hub-web-default ci-hub-web-absent || true

  hygiene:
    # The org's reusable secret check. Cheap, and it catches the failure that cannot be undone: a
    # secret pushed to a repository is compromised the moment it lands, and rotating it is the only
    # remedy.
    uses: cloudsforge-online/micro-org/.github/workflows/secret-hygiene.yml@main
    permissions:
      contents: read

  # ──────────────────────────────────────────────────────────────────────────────────────────────
  # THE IMAGE, PUBLISHED. Until this job existed the `image:` job above built this image and threw
  # it away, so the release path could not name it. Every line number below was read off the source,
  # not off the prose that cites it — the numbers in micro-org's own publish-image.yml header have
  # already drifted:
  #
  #   generator  `cfctl release` pins one image per deployable, the name from
  #              org/tools/registry.ts (`ghcr.io/<org>/<repo.repo>`, which is why the package
  #              is micro-<app> and not <app>) and the tag from that repository's package.json
  #              version, org/tools/cfctl.ts.
  #   verifier   `cfctl release --verify` runs `docker manifest inspect` on EVERY entry and returns
  #              non-zero if one cannot be pulled, org/tools/cfctl.ts.
  #   deployer   deploy/scripts/release-deploy.sh refuses to change anything while any image
  #              is missing.
  #
  # A frontend with no producer was therefore a manifest entry that could never verify.
  #
  # `packages: write` IS GRANTED HERE and not asked for inside the shared workflow, which is forced
  # rather than stylistic: a called workflow's GITHUB_TOKEN can only be maintained or reduced, never
  # elevated, so a reusable workflow asking for a permission its caller withheld fails the run at
  # STARTUP, before a step runs. Measured on micro-org: run 30900277471 (caller capped at
  # `packages: read`) ended in startup_failure; run 30900280323 (same workflow, caller granting
  # `packages: write`) succeeded. That is also why `push: false` stays in the `image:` job above —
  # that job is a GATE and needs `load:` so it can boot the container and probe it. This is the
  # producer. Different purposes, so different jobs.
  #
  # `needs:` names EVERY other job, so nothing is published that did not pass every gate this
  # repository has.
  # ──────────────────────────────────────────────────────────────────────────────────────────────
  publish:
    needs: [check, rules, image, hygiene]
    # A green push to main and nothing else. An image tag a release manifest pins has to name
    # something that passed, on the branch it will be deployed from.
    if: >-
      github.event_name == 'push' && (github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/heads/design-system/') ||
      startsWith(github.ref, 'refs/heads/release/'))
    uses: cloudsforge-online/micro-org/.github/workflows/publish-image.yml@main
    with:
      # `web`, so the producer checks micro-ui out as the `uipkg` named build context the Dockerfile
      # reads at line 23. It names ONLY the contexts its kind checked out, because buildx stats every
      # named context before it opens the Dockerfile.
      kind: web
    secrets:
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: write
