# The SPA's server block.
#
# THE ONE THING TO UNDERSTAND HERE: an unknown path answers 404, not 200.
#
# The usual SPA fallback is `try_files $uri /index.html`, which serves the bundle with a 200 for
# every address in existence. A "page not found" screen delivered as a success is indexed by
# search engines, called healthy by uptime checks, passed by link checkers — and a deploy that
# drops a route then looks exactly like a deploy that did not.
#
# So the client routes are ENUMERATED below, and everything else falls through to
# `error_page 404 /index.html`, which serves the same bundle while KEEPING the 404 status. React
# renders NotFoundPage inside it, and the status line tells the truth.
#
# The cost is that this list and the route table in src/app.tsx must agree. That is one line per
# top-level route, paid once per route, in exchange for an honest status code on every wrong URL.

# ── IS THIS HOSTNAME AN ENVIRONMENT OTHER THAN MAINNET? ────────────────────────────────────────
#
# `map` is in http context, which is why it sits above the server block rather than inside it — a
# conf.d file is included in http, so this is legal here and would not be legal ten lines down.
#
# THE LABELS ARE `ENV_LABELS` FROM @cloudsforge/ui/surfaces, and test/sitemap.test.ts reads that
# export and fails if this alternation has drifted from it. They are the words that name an
# environment rather than a surface: `surfaces.ts` reserves them so that no surface may take one as
# a subdomain, and `deploy/scripts/check-apex-prefix.py` enforces that.
#
# A testnet estate carries test EMBER and a faucet. Indexed beside the real one, its pages are a
# control centre and a SIGN-IN FORM that look exactly like the real ones — which on this surface is
# a phishing shape the platform would have published about itself, not merely an SEO problem. So a
# non-mainnet environment answers `Disallow: /` and serves no sitemap.
#
# `(?:[^.]+-)?` catches BOTH shapes. The environment is a suffix on the first label now
# (`hub-testnet.<apex>`) and was an apex prefix before (`testnet.<apex>`, which put this surface at
# the two-label `hub.testnet.<apex>` — unreachable, because Cloudflare's Universal SSL is a
# one-label wildcard and every two-label name fails the handshake at the edge). `surfaces.ts` keeps
# the old shape deliberately, so both have to match or half the estate stays indexable on testnet.
map $host $cf_env {
    default '';
    ~^(?:[^.]+-)?(?:testnet|staging|preview|dev|mainnet)\. 'yes';
}

server {
    # 8080 because the image is nginx-unprivileged: nothing in this container is root, and a
    # non-root process cannot bind 80.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing is real routing: the address must survive a hard refresh.
    absolute_redirect off;

    # ---- security headers ------------------------------------------------
    # No frame-ancestors beyond self: this surface carries a session that can move money, and a
    # product framed by another origin is a clickjacking surface for whatever that session can do.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- assets ----------------------------------------------------------
    # Immutable, because every build emits new hashed filenames. A missing asset is a 404 on its
    # own terms and must NOT fall through to the app shell: a JavaScript request answered with
    # HTML fails with a syntax error that names the wrong file.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # index.html is never cached. It is the file that names the current asset hashes, so a stale
    # copy pins a browser to a deploy that no longer exists.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---- the client routes, enumerated -----------------------------------
    # Keep in step with the route table in src/app.tsx and NAV in src/components/shell.tsx.
    location = / {
        try_files /index.html =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # `account` and `billing` are here because hub-api's "needs you" cards deep-link into them
    # (/account/security, /account/restrictions/<id>, /billing/subscriptions/<id>). They are not
    # sub-navigation entries; they are addresses another service already emits, and a card whose
    # button 404s is worse than no card.
    location ~ ^/(portfolio|wallet|activity|security|entitlements|settings|search|account|billing)(/|$) {
        try_files /index.html =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the sitemap and robots.txt, emitted with $host -------------------
    # THEY ARE HERE RATHER THAN IN public/ FOR THE ONE REASON THAT DECIDES IT: a sitemap must carry
    # ABSOLUTE URLs — the spec requires it and a crawler discards a relative `<loc>` — and nothing
    # built in this repository is allowed to name a hostname, because one image is served from
    # localhost, from a preview deployment and from the apex (test/no-build-time-config.test.ts).
    # nginx is the component that knows: it has `$host` on every request, so the addresses are
    # composed per request and the artefact stays environment-free.
    #
    # ── WHY THIS IS NOT `sitemapXml()` FROM @cloudsforge/ui ──────────────────────────────────
    #
    # THIS SURFACE IS NOT THE APEX. The shared generator composes every sibling as
    # `<subdomain>.$host`, which is exactly right on the marketing site, where `$host` IS the apex.
    # Here `$host` is already `hub.<apex>`, so the same generator would emit `network.hub.<apex>` —
    # a two-label hostname that resolves to nothing and fails the edge's one-label wildcard
    # certificate. A sitemap of addresses that cannot be connected to is worse than no sitemap: a
    # crawler handed dead URLs by a site's own index discounts the ones that work.
    #
    # ── AND WHY IT LISTS EXACTLY ONE ADDRESS ─────────────────────────────────────────────────
    #
    # Because exactly one address on this surface is true for a crawler, and the declaration of
    # which is `indexable` in src/lib/routes.ts rather than this file's opinion.
    #
    # `/` is the front door. The estate's own sitemap already advertises it (`hub` is in
    # `SITEMAP_SURFACES`), `robotsDirective()` derives `index, follow` for it from a registry row
    # carrying `servesUi: true` and no `adminOnly`, and what a crawler is served there is the shell:
    # the product's name and its one sentence.
    #
    # EVERYTHING ELSE IS OUT, and in two groups. The seven gated pages — portfolio, wallet,
    # activity, security, entitlements, settings, search — are SERVED (that is what the enumerated
    # block above is for) but would answer a crawler with a redirect into a sign-in form, so
    # advertising them is advertising a dead link. And the six ungated `account/*` addresses are the
    # estate's sign-in, registration and password-reset screens: indexing a credential form
    # publishes it to whoever searches, and two of the six are landing pages for a link addressed to
    # one person. All thirteen also carry `noindex, nofollow` from `DocumentMeta`, because a sitemap
    # is an invitation and a robots directive is an instruction and the two must not disagree.
    location = /sitemap.xml {
        # `types { }` empties the mime table FOR THIS LOCATION so `default_type` is what applies.
        # Without it nginx maps the `.xml` in the URI to `text/xml` from its own table and the
        # `default_type` line is inert — a declaration that reads as a decision and is not one.
        types { }
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
        # REPEATED, for the reason the blocks above already record: a location that declares ANY
        # add_header inherits NONE from the level above, and this block declares Cache-Control.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # An environment that must not be indexed has no sitemap. `return` inside `if` is one of the
        # two uses of `if` in a location that are defined behaviour rather than a trap.
        if ($cf_env) { return 404; }
        return 200 '<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url><loc>$scheme://$host</loc></url>
</urlset>';
    }

    location = /robots.txt {
        types { }
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Every environment but mainnet refuses every crawler, whole.
        if ($cf_env) { return 200 'User-agent: *\nDisallow: /\n'; }
        # `Allow: /` on mainnet, which is `robotsDirective()`'s answer for this registry row and is
        # not softened here. `robots.txt` is a fetch instruction and a coarse one — a `Disallow:` on
        # a path still leaves it indexable from an inbound link, with a result reading "no
        # information is available", which for a sign-in page is a search result confirming it
        # exists. The per-address refusal is the `noindex, nofollow` meta tag `DocumentMeta` applies,
        # which is the mechanism that actually removes a page from an index.
        return 200 'User-agent: *
Allow: /

Sitemap: $scheme://$host/sitemap.xml
';
    }

    # ---- everything else -------------------------------------------------
    # A real file (favicon, the OG card) is served; anything else 404s, and the error page below
    # turns that 404 into the app shell WITHOUT changing the status. robots.txt and sitemap.xml are
    # NOT files and never reach here: the two exact-match locations above beat this prefix, which is
    # also why `public/robots.txt` must not exist — it would be deployed, unreachable, and edited by
    # the next reader to no effect.
    location / {
        try_files $uri =404;
    }

    error_page 404 /index.html;

    # nginx's own health, for the container probe. It answers before the app has been fetched, so
    # it says the server is up — never that the app works. That is Beacon's job.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
